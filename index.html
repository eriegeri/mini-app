<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I miei servizi</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 18px;
      margin: 12px 0;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #2481cc;
      color: white;
    }
  </style>
</head>

<body>

  <h1>I miei servizi</h1>

  <div class="card">
    <h2>🔞 Sexchat</h2>
    <div class="price">€25</div>
    <button onclick="acquista('Sexchat', 25)">
      Acquista
    </button>
  </div>

  <div class="card">
    <h2>🎥 Video personalizzato</h2>
    <div class="price">€25</div>
    <button onclick="acquista('Video personalizzato', 25)">
      Acquista
    </button>
  </div>

  <div class="card">
    <h2>📹 Videochiamata</h2>
    <div class="price">€50</div>
    <button onclick="acquista('Videochiamata', 50)">
      Acquista
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const BACKEND_URL = "https://telegram-mini-app-kpb9.onrender.com";

async function acquista(servizio) {
  try {
    const response = await fetch(`${BACKEND_URL}/create-invoice`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        service: servizio
      })
    });

    const data = await response.json();

    if (!response.ok || !data.invoice_url) {
      tg.showAlert("Errore nella creazione del pagamento.");
      return;
    }

    tg.openInvoice(data.invoice_url, (status) => {
      if (status === "paid") {
        tg.showAlert("Pagamento completato!");
      } else if (status === "cancelled") {
        tg.showAlert("Pagamento annullato.");
      } else if (status === "failed") {
        tg.showAlert("Pagamento non riuscito.");
      }
    });

  } catch (error) {
    tg.showAlert("Errore di connessione.");
  }
}

      // Qui collegheremo il pagamento Telegram Stars.
    }
  </script>

</body>
</html>
